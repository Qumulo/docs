name: Build and validate docs
on:
  push:
    branches:
      - mainline
  repository_dispatch:
     types: [run-publish]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Rebuild Hot Topics ranking in index.md, show deltas, and commit changes
        if: ${{ github.repository == 'Qumulo/docs-internal' }}
        run: |
          ./tools/test-build-hot-topic.sh

          # Set credentials
          git config --global user.email "qontent@qumulo.com"
          git config --global user.name "Team Qontent"

          # Show deltas
          git diff

          # Commit changes
          git add --all
          git commit -m "Regenerated index.md with Hot Topic ranking" || echo "No changes to commit" >&2

        env:
          ENGINEERING_JSON: ${{ secrets.ENGINEERING_JSON }}

      - name: Build common container
        run: ./tools/test-build-container.sh

      - name: Check spelling (non-fatal)
        run: |
          # Do not fail if the check throws an error
          set +e
          ./tools/test-spelling.sh

          # Capture the exit code
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::Fix spelling errors and add exceptions to tools/.spelling-allowlist"
          fi
          exit 0

      - name: Check scripts, links, and images (non-fatal)
        shell: bash {0} # Allow manual error handling
        run: |
          # Do not fail if the check throws an error
          set +e
          ./tools/test-scripts-links-images.sh

          # Capture the exit code
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::Fix script/link/image errors. 404s for unpublished pages is normal."
          fi
          exit 0

      - name: Prepare ReadOnly SSH key - access to external repos we include
        if: ${{ github.repository == 'Qumulo/docs-internal' }}
        run: |
          echo "${{ secrets.DOCS_READONLY_KEY }}" > /tmp/ro_key
          chmod 400 /tmp/ro_key

      - name: Build documentation and sitemap.xml. _site is ready for use
        run: |
          ./tools/test-build-html.sh
        env:
          GIT_SSH_COMMAND: ssh -i /tmp/ro_key
          EXTERNAL_REPOS: ${{ env.EXTERNAL_REPOS }}

      - name: Sync and update the gh-pages branch
        env:
          GIT_ACTOR: ${{ github.actor }}
          IS_INTERNAL: ${{ github.repository == 'Qumulo/docs-internal' }}
        run: ./tools/sync-gh-pages.sh

      - name: Clean up SSH key
        if: ${{ github.repository == 'Qumulo/docs-internal' }}
        run: |
          rm -f /tmp/ro_key

  push-to-public:
    if: ${{ github.repository == 'Qumulo/docs-internal' }}
    secrets: inherit # pass all secrets
    needs: publish
    uses: ./.github/workflows/push-to-public.yml

  notify-docs-internal:
    if: ${{ github.repository != 'Qumulo/docs-internal' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify docs-internal repository of update in the current repository
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Qumulo/docs-internal/dispatches \
            -d '{"event_type":"run-publish"}'
