name: Test docs feature branch
on:
  # Push trigger for feature branch
  push:
    branches-ignore:
      - gh-pages
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # It is recommended to use specific versions
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Rebuild Hot Topics ranking in index.md and show deltas (dry run)
        if: ${{ github.repository == 'Qumulo/docs-internal' }}
        run: |
          ./tools/test-build-hot-topic.sh

          # Show deltas
          git diff

          # Revert changes before switching branches
          git reset --hard ${{ github.ref_name }}
        env:
          ENGINEERING_JSON: ${{ secrets.ENGINEERING_JSON }}

      - name: Build common container
        run: ./tools/test-build-container.sh

      - name: Check spelling
        run: |
          ./tools/test-spelling.sh || { echo "::error title=Spell Check Failed::Fix spelling errors or add exceptions to tools/.spelling-allowlist"; exit 1; }

      - name: Check for .md files not linked to a sidebar .yml file
        run: |
          ./tools/test-sidebars.sh || { echo "::error title=Sidebar Validation Failed::Ensure there are no loose .md files in the repository and that all files are added to _data/sidebars/*.yml"; exit 1; }

      - name: Check scripts, links, and images (non-fatal)
        shell: bash {0} # Allow manual error handling 
        run: |
          # Do not fail if the check throws an error
          set +e
          ./tools/test-scripts-links-images.sh

          # Capture the exit code
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning title=Script, Link, and Image Check Failed::Fix script/link/image errors. 404s for unpublished pages is normal."
          fi
          exit 0
